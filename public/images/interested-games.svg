<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Interested Games</title>
  <desc id="desc">A tile matching interest game with selected cards and score chips.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="0.5" stop-color="#365314"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <radialGradient id="spark" cx="74%" cy="24%" r="48%">
      <stop offset="0" stop-color="#fef08a" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#fef08a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="640" height="400" rx="30" fill="url(#bg)"/>
  <rect width="640" height="400" rx="30" fill="url(#spark)"/>
  <g transform="translate(108 70)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="0" width="424" height="216" rx="28" fill="#020617" opacity="0.78" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="32" y="48" font-size="18" font-weight="800" fill="#67e8f9" letter-spacing="4">INTEREST</text>
    <text x="32" y="86" font-size="34" font-weight="900" fill="#ffffff">Strategy</text>
    <g font-size="20" font-weight="900" text-anchor="middle">
      <rect x="34" y="112" width="104" height="62" rx="18" fill="#bef264"/>
      <text x="86" y="151" fill="#10200f">Chess</text>
      <rect x="158" y="112" width="104" height="62" rx="18" fill="#ffffff" opacity="0.12" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="210" y="151" fill="#ffffff">Drift</text>
      <rect x="282" y="112" width="104" height="62" rx="18" fill="#bef264"/>
      <text x="334" y="151" fill="#10200f">Plan</text>
    </g>
  </g>
  <circle cx="520" cy="112" r="42" fill="#22d3ee" opacity="0.92"/>
  <text x="520" y="125" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900" fill="#06111c">+10</text>
  <text x="40" y="322" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#fef08a" letter-spacing="4">MATCH</text>
  <text x="40" y="360" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="900" fill="#ffffff">Interested Games</text>
</svg>
